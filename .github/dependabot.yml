version: 2
updates:
  # Maintain GitHub Actions dependencies (grouped so multi-step actions like CodeQL stay in sync)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action*"
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
    ignore:
      - dependency-name: "actions/*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "softprops/action-gh-release"
        update-types: [ "version-update:semver-major" ]

  # Maintain Go dependencies in root module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Maintain Go dependencies in test/integration
  - package-ecosystem: "gomod"
    directory: "/test/integration"
    schedule:
      interval: "weekly"
    groups:
      integration-dependencies:
        patterns:
          - "*"
    ignore:
      # Newer versions require Go > 1.23, breaking the Go 1.23 CI/Release matrix
      - dependency-name: "github.com/testcontainers/testcontainers-go"
        versions: [ ">= 0.33.0" ]

  # Maintain Go dependencies in examples
  - package-ecosystem: "gomod"
    directory: "/examples/minimal"
    schedule:
      interval: "weekly"
    groups:
      example-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/examples/kubernetes"
    schedule:
      interval: "weekly"
    groups:
      example-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/examples/pgx"
    schedule:
      interval: "weekly"
    groups:
      example-dependencies:
        patterns:
          - "*"
    ignore:
      # Newer versions require Go > 1.23, breaking the Go 1.23 CI/Release matrix
      - dependency-name: "github.com/jackc/pgx/v5"
        versions: [ ">= 5.8.0" ]

  - package-ecosystem: "gomod"
    directory: "/examples/prometheus-adapter"
    schedule:
      interval: "weekly"
    groups:
      example-dependencies:
        patterns:
          - "*"
    ignore:
      # Newer versions require Go > 1.23, breaking the Go 1.23 CI/Release matrix
      - dependency-name: "github.com/prometheus/client_golang"
        versions: [ ">= 1.20.0" ]

  - package-ecosystem: "gomod"
    directory: "/examples/with-dashboard"
    schedule:
      interval: "weekly"
    groups:
      example-dependencies:
        patterns:
          - "*"

  # Maintain npm dependencies in documentation
  - package-ecosystem: "npm"
    directory: "/apps/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7.0 removes 'baseUrl' used by @docusaurus/tsconfig 3.10.2
      - dependency-name: "typescript"
        versions: [ ">= 7.0.0" ]

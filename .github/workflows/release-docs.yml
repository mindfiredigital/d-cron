name: Release docs Workflow

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "Build Docusaurus Documentation"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd apps/docs
          npm ci

      - name: Build Docusaurus
        run: |
          cd apps/docs
          npm run build

      - name: Set Git user
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Deploy to gh-pages branch
        run: |
          # Store the build artifacts
          rm -rf /tmp/docusaurus-build
          mkdir -p /tmp/docusaurus-build
          cp -r apps/docs/build/* /tmp/docusaurus-build/

          # Cleanly switch to gh-pages branch, creating orphan if it doesn't exist
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Clear tracking directory safely
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf *

          # Copy the build artifacts
          cp -r /tmp/docusaurus-build/* .

          # Stage changes before checking for actual diffs to avoid empty-commit failure
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(docs): update documentation build"
            git push origin gh-pages
            echo "✅ Documentation deployed to gh-pages"
          else
            echo "No changes to commit"
          fi
